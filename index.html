<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sook D | The Luxury Green Sanctuary of Bang Krachao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background-color: #fcfbf9;
            color: #2c302e;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', 'Sarabun', serif;
            font-weight: 400;
            letter-spacing: 1px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- Luxury Navigation Bar --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: all 0.4s ease;
        }

        header.scrolled {
            padding: 15px 50px;
            background-color: rgba(252, 251, 249, 0.95);
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            transition: color 0.3s;
        }

        header.scrolled .logo {
            color: #2c302e;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-links a {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            transition: opacity 0.3s;
        }

        header.scrolled .nav-links a {
            color: #2c302e;
        }

        .lang-switcher {
            display: flex;
            gap: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        header.scrolled .lang-switcher {
            color: rgba(44, 48, 46, 0.5);
        }

        .lang-btn {
            cursor: pointer;
            text-transform: uppercase;
        }

        .lang-btn.active {
            color: #fff;
            font-weight: 600;
            border-bottom: 1px solid #fff;
        }

        header.scrolled .lang-btn.active {
            color: #2c302e;
            border-bottom-color: #2c302e;
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: brightness(0.65);
            transition: transform 8s ease;
            transform: scale(1.05);
            z-index: 1;
        }

        .hero.active .hero-bg {
            transform: scale(1);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s ease 0.5s;
        }

        .hero.active .hero-content {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-subtitle {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .hero-title {
            font-size: 52px;
            line-height: 1.3;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* --- Intro Section --- */
        .intro {
            padding: 120px 20px 60px 20px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #8c92ac;
            margin-bottom: 20px;
            display: block;
        }

        .intro h2 {
